# Veote — auto-deploy to o2switch on push to main
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   O2SWITCH_HOST      — SSH hostname (e.g. your o2switch server)
#   O2SWITCH_USER      — SSH username
#   O2SWITCH_SSH_KEY   — private key for SSH (full PEM)
#   O2SWITCH_APP_DIR   — absolute app root on the server (e.g. /home/USER/veote)
#   O2SWITCH_NODE_VENV — path to cPanel Node activate script
#                        (e.g. /home/USER/nodevenv/veote/20/bin/activate)
#
# Do NOT put DATABASE_URL in GitHub secrets: prisma generate on the runner
# does not need a DB; `prisma db push` on the server uses the server .env /
# cPanel env vars. Never sync .env from CI.
#
# See also: DEPLOY_O2SWITCH.md § CI / GitHub Actions

name: Deploy o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build (classic Next — no standalone)
        run: npm run build

      - name: Verify App Router routes in build output
        run: |
          set -euo pipefail
          test -f .next/BUILD_ID
          test -d .next/server
          test -d .next/static
          # Routes publiques attendues (chemins français)
          for route in candidats lois sondages methodologie; do
            if [ ! -e ".next/server/app/${route}" ] && [ ! -e ".next/server/app/${route}.html" ] && [ ! -e ".next/server/app/${route}.meta" ]; then
              found="$(find .next/server/app -maxdepth 3 -type d -name "${route}" | head -1 || true)"
              if [ -z "$found" ]; then
                echo "Missing built route: /${route}" >&2
                find .next/server/app -maxdepth 2 -print >&2
                exit 1
              fi
            fi
            echo "OK built route /${route}"
          done
          cat .next/routes-manifest.json | head -c 4000 || true
          echo

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.O2SWITCH_SSH_KEY }}

      - name: Add host to known_hosts
        env:
          O2SWITCH_HOST: ${{ secrets.O2SWITCH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$O2SWITCH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync production files
        env:
          O2SWITCH_HOST: ${{ secrets.O2SWITCH_HOST }}
          O2SWITCH_USER: ${{ secrets.O2SWITCH_USER }}
          O2SWITCH_APP_DIR: ${{ secrets.O2SWITCH_APP_DIR }}
        run: |
          set -euo pipefail
          DEST="${O2SWITCH_USER}@${O2SWITCH_HOST}:${O2SWITCH_APP_DIR}"
          RSH="ssh -o StrictHostKeyChecking=yes"

          # Sync build + runtime sources only. Always exclude secrets & deps.
          # --delete on content dirs so stale chunks/schema files disappear.
          # Do not --delete the app root (preserves server .env, logs, tmp, node_modules).
          #
          # Layout attendu côté o2switch (Application root ≠ document root domaine) :
          #   server.js          ← PassengerStartupFile (listen "passenger")
          #   .next/             ← build classique (hors cache)
          #   public/ prisma/ scripts/
          #   package.json       ← npm ci --omit=dev fournit `next` pour server.js
          #
          # Ne jamais pointer le document root Apache sur public/ seul :
          # Passenger doit proxyfier TOUTES les URLs vers Node (sinon seul / marche).
          rsync -avz --delete \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'cache' \
            -e "$RSH" \
            .next/ "${DEST}/.next/"

          rsync -avz --delete \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.git' \
            -e "$RSH" \
            public/ "${DEST}/public/"

          rsync -avz --delete \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.git' \
            -e "$RSH" \
            prisma/ "${DEST}/prisma/"

          rsync -avz --delete \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.git' \
            -e "$RSH" \
            scripts/ "${DEST}/scripts/"

          rsync -avz \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.git' \
            -e "$RSH" \
            server.js package.json package-lock.json next.config.* \
            "${DEST}/"

          test -f server.js
          test -f .next/BUILD_ID
          test -d .next/server
          test -d .next/static

      - name: Install, prisma generate, migrate schema, restart Passenger
        env:
          O2SWITCH_HOST: ${{ secrets.O2SWITCH_HOST }}
          O2SWITCH_USER: ${{ secrets.O2SWITCH_USER }}
          O2SWITCH_APP_DIR: ${{ secrets.O2SWITCH_APP_DIR }}
          O2SWITCH_NODE_VENV: ${{ secrets.O2SWITCH_NODE_VENV }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes \
            "${O2SWITCH_USER}@${O2SWITCH_HOST}" \
            "set -euo pipefail
             source \"${O2SWITCH_NODE_VENV}\"
             cd \"${O2SWITCH_APP_DIR}\"
             npm ci --omit=dev
             npx prisma generate
             if [ -f prisma/schema.prisma ]; then
               npx prisma db push
             fi
             mkdir -p tmp && touch tmp/restart.txt"
